; PlatformIO Project Configuration File
; ClawVoice — Voice-first OpenClaw Cardputer Client
;
; Build & flash:
;   export WIFI_SSID="PDCN" WIFI_PASS="15011501" \
;          PROXY_HOST="192.168.123.234" PROXY_PORT="8900" \
;          OPENCLAW_TOKEN="your-token-here"
;   ~/Library/Python/3.9/bin/pio run -t upload

[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Cardputer@^1.0.2
platform_packages =
    espressif/toolchain-riscv32-esp @ 8.4.0+2021r2-patch5
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DPROXY_HOST=\"${sysenv.PROXY_HOST}\"
    -DPROXY_PORT=\"${sysenv.PROXY_PORT}\"
    -DOPENCLAW_TOKEN=\"${sysenv.OPENCLAW_TOKEN}\"
monitor_speed = 115200
