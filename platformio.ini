; PlatformIO Project Configuration File
; ClawVoice — Voice-first OpenClaw Cardputer Client
;
; Build & flash:
;   export WIFI_SSID="your-wifi" WIFI_PASS="your-password" \
;          PROXY_HOST="your-proxy-ip" PROXY_PORT="8900" \
;          OPENCLAW_TOKEN="your-token-here"
;   ~/Library/Python/3.9/bin/pio run -t upload
;
; Upload troubleshooting:
;   If Serial/JTAG upload fails, try:
;     - Power cycle the Cardputer (unplug/replug USB)
;     - Press and hold G0 button while connecting USB, then release (download mode)
;   Note: pre_upload.py auto-kills usb_bridge.py before flashing, so no manual step needed.

[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Cardputer@^1.0.2
platform_packages =
    espressif/toolchain-riscv32-esp @ 8.4.0+2021r2-patch5
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:server/pre_upload.py
